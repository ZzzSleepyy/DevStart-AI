<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevStart AI — Microphone</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0b0e;
      --surface: #11141a;
      --line: rgba(255, 255, 255, 0.1);
      --text: #e9ebef;
      --muted: #a0a4ad;
      --dim: #858a94;
      --pink: #ff4d7d;
      --purple: #a855f7;
      --blue: #4f7cff;
      --cyan: #38cfff;
      --green: #2dd4a7;
      --yellow: #ffcc57;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .brand-mark {
      display: block;
      width: 22px;
      height: 22px;
      flex: none;
      filter: drop-shadow(0 3px 10px rgba(70, 120, 255, 0.45));
    }

    .brand-mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    button {
      width: 100%;
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      background: var(--text);
      color: var(--bg);
      font: inherit;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 160ms ease, opacity 160ms ease;
    }

    button:hover:not(:disabled) { background: #fff; }
    button:disabled { opacity: 0.55; cursor: default; }

    .status {
      min-height: 20px;
      margin: 14px 0 0;
      color: var(--dim);
      font-size: 12.5px;
    }

    .status.is-ok { color: var(--green); }
    .status.is-fail { color: var(--pink); }

    .privacy {
      margin: 18px 0 0;
      color: var(--dim);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <defs>
            <linearGradient id="dsPermBowl" x1="15" y1="5" x2="34" y2="35" gradientUnits="userSpaceOnUse">
              <stop stop-color="#8b6cf6" />
              <stop offset="0.45" stop-color="#3b82f6" />
              <stop offset="1" stop-color="#22d3ee" />
            </linearGradient>
            <linearGradient id="dsPermStem" x1="10" y1="3" x2="15" y2="38" gradientUnits="userSpaceOnUse">
              <stop stop-color="#e2ebf9" />
              <stop offset="0.5" stop-color="#9cc2ff" />
              <stop offset="1" stop-color="#4f8df7" />
            </linearGradient>
          </defs>
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            fill="url(#dsPermBowl)"
            d="M17.2 2.5C12.4 9.2 9.2 16 9 22.5c-.2 6.5 2.2 11.9 7.2 15.1 5.8.2 11.4-2.4 14.6-7.1 2.8-4 3.8-7.5 3.8-10.7 0-6.2-3.6-11.8-9.6-14.6-2.6-1.2-5.2-1.8-7.8-2.7ZM14 9.5c3.8.7 7.4 1.3 10.2 2.2 4 1.4 5.6 4.5 5.6 8.3s-1.6 6.9-5.6 8.3c-2.8.9-6.4 1.5-10.2 2.2-1.4-1.5-2-3.7-2-5.8v-9c0-2.3.6-4.5 2-6.2Z"
          />
          <path
            fill="url(#dsPermStem)"
            d="M17.2 2.5C12.4 9.2 9.2 16 9 22.5c-.2 6.5 2.2 11.9 7.2 15.1-2.5-3.8-3.3-7.6-2.8-12 .5-5.4 2-15.6 3.8-23.1Z"
          />
        </svg>
      </span>
      <span class="brand-name">DevStart AI</span>
    </div>

    <h1>Allow microphone</h1>
    <p>Voice input lets you ask about the repository without typing. Audio is sent to your browser's speech recognition service, not stored by DevStart AI.</p>

    <button id="allowBtn" type="button">Allow microphone</button>
    <p class="status" id="status" role="status"></p>
    <p class="privacy">You can revoke this at any time in the browser's site settings. This tab closes itself once access is granted.</p>
  </main>

  <script src="mic-permission.js"></script>
</body>
</html>
